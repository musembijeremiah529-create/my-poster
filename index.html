<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jeremiah Electronics</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f8;
    color: #222;
}

/* HEADER */
header {
    background: linear-gradient(135deg, #061952, #087f8c);
    color: white;
    text-align: center;
    padding: 35px 15px;
}

header h1 {
    margin: 0;
    font-size: 35px;
}

header p {
    font-size: 18px;
}

/* CATEGORY BUTTONS */
.categories {
    text-align: center;
    padding: 25px 10px;
}

.categories button {
    border: none;
    background: white;
    padding: 15px 22px;
    margin: 7px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 10px #bbb;
}

.categories button:hover {
    background: #087f8c;
    color: white;
}

/* PRODUCTS */
#products {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

#categoryTitle {
    text-align: center;
    color: #061952;
}

.product-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 20px;
}

.product {
    background: white;
    padding: 20px;
    text-align: center;
    border-radius: 15px;
    box-shadow: 0 4px 12px #ccc;
}

.product-icon {
    font-size: 50px;
}

.product h3 {
    margin: 10px 0;
}

.price {
    color: #087f8c;
    font-weight: bold;
    font-size: 18px;
}

.order-button {
    background: #061952;
    color: white;
    border: none;
    padding: 11px 20px;
    border-radius: 7px;
    cursor: pointer;
}

.order-button:hover {
    background: #087f8c;
}

/* ORDER FORM */
.order {
    max-width: 600px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px #ccc;
}

.order h2 {
    text-align: center;
    color: #061952;
}

.order input,
.order select,
.order textarea {
    width: 100%;
    padding: 13px;
    margin: 8px 0 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

.whatsapp {
    width: 100%;
    background: #25D366;
    color: white;
    padding: 15px;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.whatsapp:hover {
    background: #1da851;
}

/* FOOTER */
footer {
    background: #061952;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 40px;
}
</style>
</head>

<body>

<!-- HEADER -->

<header>

    <h1>JEREMIAH ELECTRONICS</h1>

    <p>
        Electronics • Phone Accessories • Spares • Shoes
    </p>

    <p>
        Quality Products at Affordable Prices
    </p>

</header>


<!-- CATEGORY MENU -->

<div class="categories">

    <button onclick="showCategory('electronics')">
        🔌 Electronics
    </button>

    <button onclick="showCategory('accessories')">
        📱 Phone Accessories
    </button>

    <button onclick="showCategory('spares')">
        🔧 Spares
    </button>

    <button onclick="showCategory('shoes')">
        👟 Shoes
    </button>

</div>


<!-- PRODUCTS -->

<section id="products">

    <h2 id="categoryTitle">
        Click a category to view products
    </h2>

    <div id="productContainer" class="product-container">
    </div>

</section>


<!-- ORDER FORM -->

<section class="order">

    <h2>🛒 Place Your Order</h2>

    <form onsubmit="sendOrder(event)">

        <label>Your Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >


        <label>Phone Number</label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
            required
        >


        <label>Product</label>

        <select id="product" required>

            <option value="">
                Select a product
            </option>

        </select>


        <label>Quantity</label>

        <input
            type="number"
            id="quantity"
            value="1"
            min="1"
            required
        >


        <label>Delivery Location</label>

        <input
            type="text"
            id="location"
            placeholder="Enter delivery location"
            required
        >


        <label>Message</label>

        <textarea
            id="message"
            placeholder="Additional information"
        ></textarea>


        <button class="whatsapp" type="submit">

            📲 Order Through WhatsApp

        </button>

    </form>

</section>


<!-- FOOTER -->

<footer>

    <h3>Contact Us</h3>

    <p>📞 0796407278</p>

    <p>📧 jeremiahmusembi@gmail.com</p>

    <p>© 2026 Jeremiah Electronics</p>

</footer>


<script>

/* PRODUCTS */

const products = {

    electronics: [
        ["Bluetooth Speaker", "KSh 2,500", "🔊"],
        ["Smart TV", "KSh 25,000", "📺"],
        ["Electric Kettle", "KSh 1,500", "☕"],
        ["Extension Cable", "KSh 800", "🔌"]
    ],

    accessories: [
        ["Phone Charger", "KSh 700", "🔋"],
        ["USB Cable", "KSh 300", "🔌"],
        ["Earphones", "KSh 500", "🎧"],
        ["Phone Cover", "KSh 600", "📱"],
        ["Power Bank", "KSh 1,500", "🔋"]
    ],

    spares: [
        ["Phone Screen", "KSh 3,500", "📱"],
        ["Phone Battery", "KSh 1,500", "🔋"],
        ["Charging Port", "KSh 800", "🔧"],
        ["Phone Speaker", "KSh 700", "🔊"]
    ],

    shoes: [
        ["Sports Shoes", "KSh 2,500", "👟"],
        ["Sneakers", "KSh 3,000", "👟"],
        ["Casual Shoes", "KSh 2,800", "👞"],
        ["School Shoes", "KSh 2,000", "👞"]
    ]

};


/* SHOW CATEGORY */

function showCategory(category) {

    let container =
        document.getElementById("productContainer");

    let title =
        document.getElementById("categoryTitle");

    let select =
        document.getElementById("product");


    container.innerHTML = "";

    select.innerHTML =
        '<option value="">Select a product</option>';


    let categoryName = "";

    if (category === "electronics") {

        categoryName = "🔌 Electronics";

    }

    else if (category === "accessories") {

        categoryName = "📱 Phone Accessories";

    }

    else if (category === "spares") {

        categoryName = "🔧 Spares";

    }

    else if (category === "shoes") {

        categoryName = "👟 Shoes";

    }


    title.innerHTML = categoryName;


    products[category].forEach(function(item) {

        let name = item[0];

        let price = item[1];

        let icon = item[2];


        container.innerHTML += `

            <div class="product">

                <div class="product-icon">
                    ${icon}
                </div>

                <h3>${name}</h3>

                <p class="price">
                    ${price}
                </p>

                <button
                    class="order-button"
                    onclick="chooseProduct('${name}')">

                    Order Now

                </button>

            </div>

        `;


        select.innerHTML += `

            <option value="${name}">
                ${name} - ${price}
            </option>

        `;

    });

}


/* CHOOSE PRODUCT */

function chooseProduct(product) {

    document.getElementById("product").value =
        product;


    document.querySelector(".order").scrollIntoView({
        behavior: "smooth"
    });

}


/* SEND WHATSAPP ORDER */

function sendOrder(event) {

    event.preventDefault();


    let name =
        document.getElementById("name").value;

    let phone =
        document.getElementById("phone").value;

    let product =
        document.getElementById("product").value;

    let quantity =
        document.getElementById("quantity").value;

    let location =
        document.getElementById("location").value;

    let message =
        document.getElementById("message").value;


    /* YOUR WHATSAPP NUMBER */

    let whatsappNumber = "254796402278";


    let text =
        "NEW ORDER%0A%0A" +

        "Customer: " + name + "%0A" +

        "Phone: " + phone + "%0A" +

        "Product: " + product + "%0A" +

        "Quantity: " + quantity + "%0A" +

        "Delivery Location: " + location + "%0A" +

        "Message: " + message;


    let whatsappURL =
        "https://wa.me/" +
        whatsappNumber +
        "?text=" +
        text;


    window.open(
        whatsappURL,
        "_blank"
    );

}

</script>

</body>
</html>
